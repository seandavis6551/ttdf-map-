<!DOCTYPE html>
<html>
<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <script type='text/javascript' src='https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.js'></script>
  <link rel='stylesheet' href='https://atlas.microsoft.com/sdk/javascript/mapcontrol/2/atlas.min.css'>
  <style>
    html, body { width:100%; height:100%; margin:0; padding:0; }
    #map { width:100%; height:100vh; margin:0; padding:0; background:#1a1a2e; }
    #status { position:absolute; bottom:10px; left:10px; background:rgba(0,0,0,0.7);
              color:#00aaff; padding:6px 12px; border-radius:4px; font-family:sans-serif;
              font-size:12px; z-index:999; }
  </style>
</head>
<body>
  <div id='map'></div>
  <div id='status'>Loading...</div>
  <script>
    var map, datasource, popup;

    map = new atlas.Map('map', {
      center: [-61.5, 10.5],
      zoom: 10,
      style: 'satellite_road_labels',
      authOptions: {
        authType: 'subscriptionKey',
        subscriptionKey: '3hKHJVvfOvlOgoSjetKsRIcbIwEF8zUe1VENCSmLB6w5BnijsIVjJQQJ99CBACYeBjFxYSSkAAAgAZMP4VAj'
      }
    });

    map.events.add('ready', function() {

      datasource = new atlas.source.DataSource();
      map.sources.add(datasource);

      map.layers.add(new atlas.layer.BubbleLayer(datasource, 'bubble-layer', {
        radius: 10,
        color: ['match', ['get', 'type'],
          'Base', '#00aaff',
          'Ops', '#ff6600',
          '#ffffff'
        ],
        strokeColor: '#ffffff',
        strokeWidth: 2
      }));

      map.layers.add(new atlas.layer.SymbolLayer(datasource, 'label-layer', {
        iconOptions: { image: 'none' },
        textOptions: {
          textField: ['get', 'label'],
          offset: [0, 1.8],
          color: '#ffffff',
          size: 11,
          haloColor: '#000000',
          haloWidth: 1
        }
      }));

      popup = new atlas.Popup({ pixelOffset: [0, -15] });

      map.events.add('click', 'bubble-layer', function(e) {
        if (e.shapes && e.shapes.length > 0) {
          var p = e.shapes[0].getProperties();
          var content = '';
          if (p.type === 'Base') {
            content =
              '<div style="background:#1a1a2e;color:#fff;padding:12px;border-radius:8px;font-family:sans-serif;min-width:200px;border:1px solid #00aaff">' +
              '<div style="color:#00aaff;font-weight:bold;font-size:14px;margin-bottom:8px">BASE</div>' +
              '<b>Base:</b> ' + p.label + '<br>' +
              '<b>Commander:</b> ' + p.commander + '<br>' +
              '<b>Manpower:</b> ' + p.manpower +
              '</div>';
          } else {
            content =
              '<div style="background:#1a1a2e;color:#fff;padding:12px;border-radius:8px;font-family:sans-serif;min-width:200px;border:1px solid #ff6600">' +
              '<div style="color:#ff6600;font-weight:bold;font-size:14px;margin-bottom:8px">OPERATION</div>' +
              '<b>Asset:</b> ' + p.label + '<br>' +
              '<b>Ops Type:</b> ' + p.opsType + '<br>' +
              '<b>Category:</b> ' + p.opsCat + '<br>' +
              '<b>Priority:</b> ' + p.priority +
              '</div>';
          }
          popup.setOptions({ position: e.shapes[0].getCoordinates(), content: content });
          popup.open(map);
        }
      });

      map.controls.add([
        new atlas.control.ZoomControl(),
        new atlas.control.CompassControl(),
        new atlas.control.StyleControl(),
        new atlas.control.FullscreenControl()
      ], { position: 'top-right' });

      fetchData();
      setInterval(fetchData, 30000);
    });

    async function fetchData() {
      try {
        document.getElementById('status').innerText = 'Updating...';

        var baseUrl = "https://solaris6551.sharepoint.com/sites/SolarisSecurityOperationsHub/_api/web/lists/getbytitle('Base and Command Register')/items?$select=Latitude,Longitude,Base_x0020_Name,Officer_x0020_In_x0020_Command,Manpower&$top=100";

        var opsUrl = "https://solaris6551.sharepoint.com/sites/SolarisSecurityOperationsHub/_api/web/lists/getbytitle('Joint Operations Activity Log')/items?$select=Latitude,Longitude,Asset_x0020_Used,Operations_x0020_Type,Operations_x0020_Category,Priority&$top=100";

        var headers = {
          'Accept': 'application/json;odata=verbose'
        };

        var [baseRes, opsRes] = await Promise.all([
          fetch(baseUrl, { headers: headers, credentials: 'include' }),
          fetch(opsUrl, { headers: headers, credentials: 'include' })
        ]);

        var baseData = await baseRes.json();
        var opsData = await opsRes.json();

        datasource.clear();
        if (popup) popup.close();
        var count = 0;

        if (baseData.d && baseData.d.results) {
          baseData.d.results.forEach(function(f) {
            var lat = parseFloat(f.Latitude);
            var lng = parseFloat(f.Longitude);
            if (!isNaN(lat) && !isNaN(lng)) {
              datasource.add(new atlas.data.Feature(
                new atlas.data.Point([lng, lat]), {
                  type: 'Base',
                  label: f.Base_x0020_Name || 'Base',
                  commander: f.Officer_x0020_In_x0020_Command || 'Unknown',
                  manpower: String(f.Manpower) || 'Unknown'
                }
              ));
              count++;
            }
          });
        }

        if (opsData.d && opsData.d.results) {
          opsData.d.results.forEach(function(f) {
            var lat = parseFloat(f.Latitude);
            var lng = parseFloat(f.Longitude);
            if (!isNaN(lat) && !isNaN(lng)) {
              datasource.add(new atlas.data.Feature(
                new atlas.data.Point([lng, lat]), {
                  type: 'Ops',
                  label: f.Asset_x0020_Used || 'Asset',
                  opsType: f.Operations_x0020_Type || 'Unknown',
                  opsCat: f.Operations_x0020_Category || 'Unknown',
                  priority: f.Priority || 'Unknown'
                }
              ));
              count++;
            }
          });
        }

        var now = new Date().toLocaleTimeString();
        document.getElementById('status').innerText = 'Tracked: ' + count + ' | Updated: ' + now;

      } catch(err) {
        document.getElementById('status').innerText = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
